name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            Indoor-Navigation-System/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Backend — install
        working-directory: backend
        run: npm ci

      - name: Backend — typecheck + unit/API tests
        working-directory: backend
        run: npm test

      - name: Backend — validate template site data
        working-directory: backend
        run: npm run import-site -- _template --dry-run

      - name: Frontend — install
        working-directory: Indoor-Navigation-System
        run: npm ci

      - name: Frontend — typecheck, lint, unit tests, build
        working-directory: Indoor-Navigation-System
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Frontend — end-to-end tests (demo server, simulated compass)
        working-directory: Indoor-Navigation-System
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Analysis — tests
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts/tests -v
